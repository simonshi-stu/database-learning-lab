name: Order project — real Kubernetes
on:
  push:
    branches:
      - feat/cloud-backend-learning
      - feat/order-project-learning
    paths:
      - 'order_project/**'
      - '.github/workflows/order-project-kind.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  order-project-kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check reference files on CPython
        run: PYTHONPATH=order_project/reference python3 -m unittest discover -s order_project/tests -p checks.py -v
      - name: Start a real Kubernetes cluster and preload the Python image
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install sigs.k8s.io/kind@v0.27.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          kind create cluster --name order-lab --wait 120s
          docker pull python:3.12-slim
          kind load docker-image --name order-lab python:3.12-slim
      - name: Deploy and observe replacement, health and retained order
        run: |
          set -o pipefail
          python3 order_project/run_cluster.py --context kind-order-lab --image python:3.12-slim | tee order-observation.json
      - name: Attach exercise evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: order-observation
          path: order-observation.json
          if-no-files-found: ignore
      - name: Remove cluster
        if: always()
        run: if command -v kind >/dev/null; then kind delete cluster --name order-lab; fi
  analyze:
    name: Replay real evidence through the reference observer
    needs: order-project-kind
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: order-observation
          path: observed
      - name: Compare observer with independent checks
        run: PYTHONPATH=order_project/reference python3 order_project/tests/checks.py --observation observed/order-observation.json
